# Fly.io config for kanNINJA frontend (Next.js).
# Deploy from v2/ root: `fly deploy --config fly.frontend.toml`

app = "kanninja-frontend"
primary_region = "iad"  # should match backend region to minimize latency

[build]
  dockerfile = "Dockerfile.frontend"
  # NEXT_PUBLIC_* vars must be baked in at build time.
  # Set non-secret values here; secret values are passed as --build-arg on deploy.
  [build.args]
    NEXT_PUBLIC_CLERK_SIGN_IN_URL = "/sign-in"
    NEXT_PUBLIC_CLERK_SIGN_UP_URL = "/sign-up"
    NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL = "/dashboard"
    NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL = "/dashboard"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
