name: Seed Key Vault from Actions secrets

# A ONE-SHOT RECOVERY TOOL. Run it once during the Azure migration, then delete
# this file.
#
# WHY IT EXISTS. GitHub Actions secrets are write-only: the REST API returns a
# name and two timestamps and never a value, to anyone, with any token. That is
# a design property, not a permission to be granted. So the only way to read a
# secret is to be a workflow — which is exactly what this is.
#
# NOTHING IS EVER PRINTED. Each value goes into a file with `printf '%s'`, is
# handed to `az keyvault secret set --file`, and is verified by comparing a
# SHA-256 of the file against a SHA-256 of what the vault returns. The log gets
# a name and the word `verified`. GitHub also masks registered secret values in
# logs, but this does not rely on that — masking is a backstop, not the design.
#
# WHY `--file` AND NOT `--value`: a secret containing a quote, a backtick or a
# `$` can be mangled by shell quoting on its way to the CLI, storing something
# that looks set and does not work. Bytes written by `printf '%s'` are exact.
# It also keeps values out of the process argument list.
#
# PERMISSIONS. The deploy identity holds `Key Vault Secrets User`, which is
# READ-ONLY by design — the pipeline reads secrets, it does not write them.
# Running this needs a temporary `Key Vault Secrets Officer` grant, and the
# grant should be revoked immediately afterwards:
#
#   SP=$(az ad sp list --display-name gha-kanninja-prod --query '[0].id' -o tsv)
#   VAULT=$(az keyvault show -n kv-kanninja-prod-cus --query id -o tsv)
#
#   az role assignment create --assignee-object-id "$SP" \
#     --assignee-principal-type ServicePrincipal \
#     --role "Key Vault Secrets Officer" --scope "$VAULT"
#
#   # ... run this workflow ...
#
#   az role assignment delete --assignee "$SP" \
#     --role "Key Vault Secrets Officer" --scope "$VAULT"
#
# WHAT IS DELIBERATELY NOT COPIED. Terraform owns DATABASE-URL,
# DATABASE-ADMIN-URL, KANNINJA-APP-PASSWORD, BETTER-AUTH-SECRET and the
# AZURE-STORAGE-* pair. The GitHub copy of DATABASE_URL points at SUPABASE, and
# copying it would overwrite the Azure connection string with the old
# database's — a deploy that works perfectly and writes to the wrong place.
# Those names are absent from the list below and must stay absent.

on:
    workflow_dispatch:
        inputs:
            vault:
                description: 'Key Vault name — typed out, as a confirmation'
                required: true
                default: 'kv-kanninja-prod-cus'

permissions:
    contents: read
    id-token: write

jobs:
    seed:
        name: Copy secrets into Key Vault
        runs-on: ubuntu-latest
        steps:
            - uses: azure/login@v2
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            - name: Copy
              env:
                  VAULT: ${{ github.event.inputs.vault }}
                  # Referenced through `env:` rather than interpolated into the
                  # script body. A `${{ secrets.X }}` written inline is
                  # substituted into the shell source BEFORE bash parses it, so
                  # a value containing a quote can end the string early and the
                  # rest is executed. Through the environment it is only ever
                  # data.
                  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
                  STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                  INTEGRATION_ENCRYPTION_KEY: ${{ secrets.INTEGRATION_ENCRYPTION_KEY }}
                  MCP_JWT_SECRET: ${{ secrets.MCP_JWT_SECRET }}
                  MCP_S2S_TOKEN: ${{ secrets.MCP_S2S_TOKEN }}
                  # Outgoing, but needed while the legacy branch in
                  # require-auth.ts is the Better Auth rollback.
                  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
                  CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
                  # Integration OAuth clients — each absent one costs exactly
                  # one provider, so none of these blocks anything.
                  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
                  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
                  SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
                  SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
                  SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
                  GITHUB_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}
                  GITHUB_CLIENT_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET }}
                  GITHUB_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
                  MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
                  MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
                  MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
                  ATLASSIAN_CLIENT_ID: ${{ secrets.ATLASSIAN_CLIENT_ID }}
                  ATLASSIAN_CLIENT_SECRET: ${{ secrets.ATLASSIAN_CLIENT_SECRET }}
                  GITLAB_CLIENT_ID: ${{ secrets.GITLAB_CLIENT_ID }}
                  GITLAB_CLIENT_SECRET: ${{ secrets.GITLAB_CLIENT_SECRET }}
                  GITLAB_INSTANCE_URL: ${{ secrets.GITLAB_INSTANCE_URL }}
                  DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
                  DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
                  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
                  DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
                  NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}
                  NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
                  FIGMA_CLIENT_ID: ${{ secrets.FIGMA_CLIENT_ID }}
                  FIGMA_CLIENT_SECRET: ${{ secrets.FIGMA_CLIENT_SECRET }}
                  LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
                  LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
                  DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
                  DROPBOX_CLIENT_SECRET: ${{ secrets.DROPBOX_CLIENT_SECRET }}
                  LOOM_CLIENT_ID: ${{ secrets.LOOM_CLIENT_ID }}
                  LOOM_CLIENT_SECRET: ${{ secrets.LOOM_CLIENT_SECRET }}
                  ZENDESK_CLIENT_ID: ${{ secrets.ZENDESK_CLIENT_ID }}
                  ZENDESK_CLIENT_SECRET: ${{ secrets.ZENDESK_CLIENT_SECRET }}
                  INTERCOM_CLIENT_ID: ${{ secrets.INTERCOM_CLIENT_ID }}
                  INTERCOM_CLIENT_SECRET: ${{ secrets.INTERCOM_CLIENT_SECRET }}
                  HUBSPOT_CLIENT_ID: ${{ secrets.HUBSPOT_CLIENT_ID }}
                  HUBSPOT_CLIENT_SECRET: ${{ secrets.HUBSPOT_CLIENT_SECRET }}
                  SALESFORCE_CLIENT_ID: ${{ secrets.SALESFORCE_CLIENT_ID }}
                  SALESFORCE_CLIENT_SECRET: ${{ secrets.SALESFORCE_CLIENT_SECRET }}
              run: |
                  set -euo pipefail
                  # NO `set -x`. Tracing would echo every expansion, which is
                  # the one thing this workflow exists to avoid.

                  umask 077
                  work=$(mktemp -d)
                  trap 'rm -rf "$work"' EXIT

                  names=(
                    STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET
                    OPENAI_API_KEY
                    INTEGRATION_ENCRYPTION_KEY
                    MCP_JWT_SECRET MCP_S2S_TOKEN
                    CLERK_SECRET_KEY CLERK_WEBHOOK_SECRET
                    GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET
                    SLACK_CLIENT_ID SLACK_CLIENT_SECRET SLACK_SIGNING_SECRET
                    GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET GITHUB_WEBHOOK_SECRET
                    MICROSOFT_CLIENT_ID MICROSOFT_CLIENT_SECRET MICROSOFT_TENANT_ID
                    ATLASSIAN_CLIENT_ID ATLASSIAN_CLIENT_SECRET
                    GITLAB_CLIENT_ID GITLAB_CLIENT_SECRET GITLAB_INSTANCE_URL
                    DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET DISCORD_BOT_TOKEN DISCORD_PUBLIC_KEY
                    NOTION_CLIENT_ID NOTION_CLIENT_SECRET
                    FIGMA_CLIENT_ID FIGMA_CLIENT_SECRET
                    LINEAR_CLIENT_ID LINEAR_CLIENT_SECRET
                    DROPBOX_CLIENT_ID DROPBOX_CLIENT_SECRET
                    LOOM_CLIENT_ID LOOM_CLIENT_SECRET
                    ZENDESK_CLIENT_ID ZENDESK_CLIENT_SECRET
                    INTERCOM_CLIENT_ID INTERCOM_CLIENT_SECRET
                    HUBSPOT_CLIENT_ID HUBSPOT_CLIENT_SECRET
                    SALESFORCE_CLIENT_ID SALESFORCE_CLIENT_SECRET
                  )

                  copied=0; absent=0; failed=0

                  for name in "${names[@]}"; do
                    value="${!name:-}"
                    if [ -z "$value" ]; then
                      echo "  absent  $name"
                      absent=$((absent+1))
                      continue
                    fi

                    kv_name="${name//_/-}"
                    f="$work/secret"
                    # printf '%s' — NOT echo. `echo` appends a newline, and a
                    # trailing newline becomes part of the stored secret. For
                    # key material that is the fault that invalidates
                    # everything while every screen still looks correct.
                    printf '%s' "$value" > "$f"

                    if ! az keyvault secret set --vault-name "$VAULT" \
                           --name "$kv_name" --file "$f" --encoding utf-8 \
                           --output none 2>/dev/null; then
                      echo "  FAILED  $name"
                      failed=$((failed+1))
                      rm -f "$f"
                      continue
                    fi

                    # Verify the round trip by digest. Only the verdict is
                    # printed — a digest of a low-entropy secret is guessable
                    # offline, so the hashes stay out of the log too.
                    src=$(sha256sum "$f" | cut -d' ' -f1)
                    az keyvault secret show --vault-name "$VAULT" --name "$kv_name" \
                      --query value -o tsv > "$work/readback" 2>/dev/null
                    # `-o tsv` appends a newline of its own; strip exactly one
                    # so the comparison is against the stored bytes.
                    printf '%s' "$(cat "$work/readback")" > "$work/readback.trimmed"
                    dst=$(sha256sum "$work/readback.trimmed" | cut -d' ' -f1)
                    rm -f "$f" "$work/readback" "$work/readback.trimmed"

                    if [ "$src" != "$dst" ]; then
                      echo "  MISMATCH $name — stored value differs from source"
                      failed=$((failed+1))
                      continue
                    fi

                    echo "  copied  $name -> $kv_name  (verified)"
                    copied=$((copied+1))
                  done

                  echo
                  echo "copied $copied, absent $absent, failed $failed"
                  [ "$failed" -eq 0 ]

            - name: What the deploy still needs
              run: |
                  set -euo pipefail
                  # Read back only NAMES. This step never touches a value.
                  present=$(az keyvault secret list --vault-name "${{ github.event.inputs.vault }}" \
                              --query '[].name' -o tsv)

                  required="DATABASE-URL BETTER-AUTH-SECRET AZURE-STORAGE-ACCOUNT AZURE-STORAGE-KEY
                            RESEND-API-KEY GOOGLE-AUTH-CLIENT-ID GOOGLE-AUTH-CLIENT-SECRET
                            STRIPE-SECRET-KEY STRIPE-WEBHOOK-SECRET AZURE-OPENAI-API-KEY
                            INTEGRATION-ENCRYPTION-KEY MCP-JWT-SECRET MCP-S2S-TOKEN"

                  missing=""
                  for r in $required; do
                    echo "$present" | grep -qx "$r" || missing="$missing $r"
                  done

                  if [ -n "$missing" ]; then
                    echo "::warning::Deploy still blocked on:$missing"
                    {
                      echo "### Still missing"
                      for m in $missing; do echo "- \`$m\`"; done
                      echo
                      echo 'Set one with: `az keyvault secret set --vault-name <vault> --name <NAME> --value "..."`'
                    } >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo "### Every required secret is present" >> "$GITHUB_STEP_SUMMARY"
                  fi
