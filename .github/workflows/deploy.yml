name: Build & Deploy to GKE

# Builds the three deployed images (backend, frontend, mcp-remote) and pushes
# them to Artifact Registry, then rolls them out to the shared sparx-prod
# Autopilot cluster in the `kanninja` namespace.
#
# Auth model (mirrors sparx.works/.github/workflows/*):
#   - Workload Identity Federation (no long-lived keys). The `kanninja-pool`
#     provider is locked to this repo and lets us impersonate kanninja-deployer.
#   - The cluster control plane is private + authorized-networks-locked, so we
#     reach it through GKE Connect Gateway (fleet membership), NOT the public
#     IP. `get-gke-credentials` would hand back the unreachable public endpoint.
#
# The npm-distributed stdio MCP image (build-mcp) still publishes to GHCR — it's
# a public artifact users pull, not a cluster workload, so it doesn't move to AR.

on:
    push:
        branches: [ main ]
    workflow_dispatch:

permissions:
    contents: read
    id-token: write # required for Workload Identity Federation

env:
    PROJECT_ID: sparxworks
    PROJECT_NUMBER: "631794111842"
    REGION: us-central1
    CLUSTER: sparx-prod-autopilot
    NAMESPACE: kanninja
    AR_REPO: kanninja
    AR_HOST: us-central1-docker.pkg.dev
    # Public identifiers (no secret value). WIF binds brandonkorous/kanninja to
    # the kanninja-deployer SA via the kanninja-pool provider.
    WIF_PROVIDER: projects/631794111842/locations/global/workloadIdentityPools/kanninja-pool/providers/kanninja-provider
    DEPLOYER_SA: kanninja-deployer@sparxworks.iam.gserviceaccount.com
    # GHCR (build-mcp only — npm/distribution artifact, not a cluster image).
    REGISTRY: ghcr.io
    IMAGE_OWNER: brandonkorous

jobs:
    # ------------------------------------------------------------------
    # Build & push backend image → Artifact Registry
    # ------------------------------------------------------------------
    build-backend:
        name: Build backend
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ env.WIF_PROVIDER }}
                  service_account: ${{ env.DEPLOYER_SA }}

            - uses: google-github-actions/setup-gcloud@v2

            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker ${{ env.AR_HOST }} --quiet

            - uses: docker/setup-buildx-action@v3

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.AR_HOST }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/backend
                  tags: |
                      type=sha,prefix=sha-,format=short
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build & push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile.backend
                  push: true
                  provenance: false
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=backend
                  cache-to: type=gha,mode=min,scope=backend,ignore-error=true

    # ------------------------------------------------------------------
    # Build & push frontend image (Next.js — public env vars baked in)
    # ------------------------------------------------------------------
    build-frontend:
        name: Build frontend
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ env.WIF_PROVIDER }}
                  service_account: ${{ env.DEPLOYER_SA }}

            - uses: google-github-actions/setup-gcloud@v2

            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker ${{ env.AR_HOST }} --quiet

            - uses: docker/setup-buildx-action@v3

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.AR_HOST }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend
                  tags: |
                      type=sha,prefix=sha-,format=short
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build & push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile.frontend
                  push: true
                  provenance: false
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=frontend
                  cache-to: type=gha,mode=min,scope=frontend,ignore-error=true
                  build-args: |
                      NEXT_PUBLIC_API_URL=https://api.kanninja.com
                      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
                      NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                      NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
                      NEXT_PUBLIC_GA_MEASUREMENT_ID=G-2XYLPDDZ9K
                      NEXT_PUBLIC_CLARITY_PROJECT_ID=wh11efmbfb

    # ------------------------------------------------------------------
    # Build & push MCP remote image (Streamable HTTP — deployed to GKE)
    # ------------------------------------------------------------------
    build-mcp-remote:
        name: Build MCP remote
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ env.WIF_PROVIDER }}
                  service_account: ${{ env.DEPLOYER_SA }}

            - uses: google-github-actions/setup-gcloud@v2

            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker ${{ env.AR_HOST }} --quiet

            - uses: docker/setup-buildx-action@v3

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.AR_HOST }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/mcp-remote
                  tags: |
                      type=sha,prefix=sha-,format=short
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build & push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile.mcp-remote
                  push: true
                  provenance: false
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=mcp-remote
                  cache-to: type=gha,mode=min,scope=mcp-remote,ignore-error=true

    # ------------------------------------------------------------------
    # Build & push MCP server image (npm-published stdio variant → GHCR).
    # NOT deployed to the cluster — a public distribution artifact.
    # ------------------------------------------------------------------
    build-mcp:
        name: Build MCP server
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/kanninja-mcp
                  tags: |
                      type=sha,prefix=sha-,format=short
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build & push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile.mcp
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=mcp
                  cache-to: type=gha,mode=max,scope=mcp,ignore-error=true

    # ------------------------------------------------------------------
    # Deploy to GKE (sparx-prod Autopilot, kanninja namespace)
    # ------------------------------------------------------------------
    deploy:
        name: Deploy to GKE
        runs-on: ubuntu-latest
        needs: [ build-backend, build-frontend, build-mcp-remote ]
        concurrency:
            group: deploy-gke-prod
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v4

            - uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ env.WIF_PROVIDER }}
                  service_account: ${{ env.DEPLOYER_SA }}

            - name: Set up gcloud + auth plugin
              uses: google-github-actions/setup-gcloud@v2
              with:
                  install_components: gke-gcloud-auth-plugin

            # Connect Gateway routes through Google's proxy and reaches the
            # private control plane. `get-gke-credentials` would return the
            # public IP (35.255.x.x) which is unreachable from the runner — the
            # cluster has authorized networks locked. Fleet membership lives at
            # `global` (sparx.works/terraform/modules/gke/main.tf).
            - name: Get GKE credentials via Connect Gateway
              run: gcloud container fleet memberships get-credentials "$CLUSTER" --location global

            - name: Set up Kustomize
              uses: imranismail/setup-kustomize@v2

            # Ensure the namespace exists before writing Secrets into it.
            # Idempotent: `kubectl apply -k` reconciles it anyway.
            - name: Ensure namespace
              run: |
                  kubectl get namespace "$NAMESPACE" 2>/dev/null \
                    || kubectl create namespace "$NAMESPACE"

            # Upsert cluster Secrets from individual GitHub Actions secrets (one
            # GH secret per env var — rotatable + auditable independently). Runs
            # every deploy so GitHub is the source of truth. Unchanged from the
            # AKS pipeline except the GHCR-rotator credentials are gone.
            - name: Bootstrap cluster Secrets from GitHub Actions secrets
              env:
                  # --- Backend core ---
                  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
                  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
                  CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
                  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
                  STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                  INTEGRATION_ENCRYPTION_KEY: ${{ secrets.INTEGRATION_ENCRYPTION_KEY }}

                  # --- Optional: OAuth provider integrations ---
                  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
                  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
                  SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
                  SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
                  SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
                  GH_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}
                  GH_APP_CLIENT_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET }}
                  GH_APP_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
                  MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
                  MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
                  MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
                  ATLASSIAN_CLIENT_ID: ${{ secrets.ATLASSIAN_CLIENT_ID }}
                  ATLASSIAN_CLIENT_SECRET: ${{ secrets.ATLASSIAN_CLIENT_SECRET }}
                  GITLAB_CLIENT_ID: ${{ secrets.GITLAB_CLIENT_ID }}
                  GITLAB_CLIENT_SECRET: ${{ secrets.GITLAB_CLIENT_SECRET }}
                  GITLAB_INSTANCE_URL: ${{ secrets.GITLAB_INSTANCE_URL }}
                  DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
                  DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
                  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
                  DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
                  NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}
                  NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
                  FIGMA_CLIENT_ID: ${{ secrets.FIGMA_CLIENT_ID }}
                  FIGMA_CLIENT_SECRET: ${{ secrets.FIGMA_CLIENT_SECRET }}
                  LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
                  LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
                  DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
                  DROPBOX_CLIENT_SECRET: ${{ secrets.DROPBOX_CLIENT_SECRET }}
                  LOOM_CLIENT_ID: ${{ secrets.LOOM_CLIENT_ID }}
                  LOOM_CLIENT_SECRET: ${{ secrets.LOOM_CLIENT_SECRET }}
                  ZENDESK_CLIENT_ID: ${{ secrets.ZENDESK_CLIENT_ID }}
                  ZENDESK_CLIENT_SECRET: ${{ secrets.ZENDESK_CLIENT_SECRET }}
                  INTERCOM_CLIENT_ID: ${{ secrets.INTERCOM_CLIENT_ID }}
                  INTERCOM_CLIENT_SECRET: ${{ secrets.INTERCOM_CLIENT_SECRET }}
                  HUBSPOT_CLIENT_ID: ${{ secrets.HUBSPOT_CLIENT_ID }}
                  HUBSPOT_CLIENT_SECRET: ${{ secrets.HUBSPOT_CLIENT_SECRET }}
                  SALESFORCE_CLIENT_ID: ${{ secrets.SALESFORCE_CLIENT_ID }}
                  SALESFORCE_CLIENT_SECRET: ${{ secrets.SALESFORCE_CLIENT_SECRET }}

                  # --- MCP OAuth (shared: mcp-remote mints, backend validates) ---
                  MCP_JWT_SECRET: ${{ secrets.MCP_JWT_SECRET }}
                  MCP_S2S_TOKEN: ${{ secrets.MCP_S2S_TOKEN }}
              run: |
                  set -euo pipefail
                  NS="$NAMESPACE"

                  # Required = the minimum the server needs to boot + serve auth.
                  # Everything else is feature-level and handled gracefully when
                  # absent, so optional providers never block the deploy.
                  required=(
                    SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY DATABASE_URL
                    CLERK_SECRET_KEY
                  )
                  missing=()
                  for var in "${required[@]}"; do
                    if [ -z "${!var:-}" ]; then missing+=("$var"); fi
                  done
                  if [ ${#missing[@]} -gt 0 ]; then
                    echo "::error::Required GitHub Actions secrets are empty: ${missing[*]}"
                    echo "::error::Set them at: Settings → Secrets and variables → Actions"
                    exit 1
                  fi

                  # Backend: only add --from-literal for non-empty vars so optional
                  # provider secrets don't create empty Secret keys. ConfigMap-owned
                  # keys (NODE_ENV, HOST, PORT, FRONTEND_URL) are intentionally not
                  # here. CLERK_PUBLISHABLE_KEY is declared in env.ts but never read.
                  backend_keys=(
                    SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY DATABASE_URL
                    CLERK_SECRET_KEY CLERK_WEBHOOK_SECRET
                    STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET
                    OPENAI_API_KEY INTEGRATION_ENCRYPTION_KEY
                    MCP_JWT_SECRET MCP_S2S_TOKEN
                    GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET
                    SLACK_CLIENT_ID SLACK_CLIENT_SECRET SLACK_SIGNING_SECRET
                    MICROSOFT_CLIENT_ID MICROSOFT_CLIENT_SECRET MICROSOFT_TENANT_ID
                    ATLASSIAN_CLIENT_ID ATLASSIAN_CLIENT_SECRET
                    GITLAB_CLIENT_ID GITLAB_CLIENT_SECRET GITLAB_INSTANCE_URL
                    DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET DISCORD_BOT_TOKEN DISCORD_PUBLIC_KEY
                    NOTION_CLIENT_ID NOTION_CLIENT_SECRET
                    FIGMA_CLIENT_ID FIGMA_CLIENT_SECRET
                    LINEAR_CLIENT_ID LINEAR_CLIENT_SECRET
                    DROPBOX_CLIENT_ID DROPBOX_CLIENT_SECRET
                    LOOM_CLIENT_ID LOOM_CLIENT_SECRET
                    ZENDESK_CLIENT_ID ZENDESK_CLIENT_SECRET
                    INTERCOM_CLIENT_ID INTERCOM_CLIENT_SECRET
                    HUBSPOT_CLIENT_ID HUBSPOT_CLIENT_SECRET
                    SALESFORCE_CLIENT_ID SALESFORCE_CLIENT_SECRET
                  )
                  # Backend reads env.GITHUB_* at runtime; map GH_APP_* (renamed to
                  # dodge GitHub's reserved GITHUB_ secret prefix) back to GITHUB_*.
                  backend_extra_keys=(GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET GITHUB_WEBHOOK_SECRET)
                  declare -A backend_extra_sources=(
                    [GITHUB_CLIENT_ID]="$GH_APP_CLIENT_ID"
                    [GITHUB_CLIENT_SECRET]="$GH_APP_CLIENT_SECRET"
                    [GITHUB_WEBHOOK_SECRET]="$GH_APP_WEBHOOK_SECRET"
                  )

                  args=()
                  for key in "${backend_keys[@]}"; do
                    value="${!key:-}"
                    [ -n "$value" ] && args+=("--from-literal=$key=$value")
                  done
                  for key in "${backend_extra_keys[@]}"; do
                    value="${backend_extra_sources[$key]:-}"
                    [ -n "$value" ] && args+=("--from-literal=$key=$value")
                  done

                  kubectl -n "$NS" create secret generic backend-secrets \
                      "${args[@]}" \
                      --dry-run=client -o yaml | kubectl apply -f -

                  # Frontend: CLERK_SECRET_KEY only (Next.js middleware).
                  kubectl -n "$NS" create secret generic frontend-secrets \
                      --from-literal=CLERK_SECRET_KEY="$CLERK_SECRET_KEY" \
                      --dry-run=client -o yaml | kubectl apply -f -

                  # MCP remote: JWT signing key (shared with backend) + S2S token
                  # for backend's internal /api/v1/oauth/* endpoints. Empty values
                  # tolerated so the deploy doesn't block before MCP OAuth ships.
                  mcp_args=()
                  [ -n "${MCP_JWT_SECRET:-}" ] \
                      && mcp_args+=("--from-literal=MCP_JWT_SECRET=$MCP_JWT_SECRET")
                  [ -n "${MCP_S2S_TOKEN:-}" ] \
                      && mcp_args+=("--from-literal=MCP_S2S_TOKEN=$MCP_S2S_TOKEN")
                  kubectl -n "$NS" create secret generic mcp-secrets \
                      "${mcp_args[@]}" \
                      --dry-run=client -o yaml | kubectl apply -f -

                  echo "Upserted backend-secrets, frontend-secrets, mcp-secrets."

            - name: Pin image tags
              working-directory: k8s
              run: |
                  SHA_TAG="sha-${GITHUB_SHA::7}"
                  BASE="${{ env.AR_HOST }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}"
                  kustomize edit set image "$BASE/backend=$BASE/backend:${SHA_TAG}"
                  kustomize edit set image "$BASE/frontend=$BASE/frontend:${SHA_TAG}"
                  kustomize edit set image "$BASE/mcp-remote=$BASE/mcp-remote:${SHA_TAG}"
                  echo "--- resolved kustomization.yaml ---"
                  cat kustomization.yaml

            - name: Apply manifests
              working-directory: k8s
              run: kubectl apply -k .

            - name: Wait for rollout
              run: |
                  kubectl -n "$NAMESPACE" rollout status deploy/backend --timeout=5m
                  kubectl -n "$NAMESPACE" rollout status deploy/frontend --timeout=5m
                  kubectl -n "$NAMESPACE" rollout status deploy/mcp --timeout=5m

            - name: Summary
              if: always()
              run: |
                  echo "### Deployment summary" >> $GITHUB_STEP_SUMMARY
                  kubectl -n "$NAMESPACE" get deploy,svc >> $GITHUB_STEP_SUMMARY
