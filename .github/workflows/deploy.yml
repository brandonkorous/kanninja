name: Build & Deploy to AKS

on:
    push:
        branches: [ main ]
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_OWNER: brandonkorous
    AKS_RESOURCE_GROUP: rg-ww-platform-prod-wu3
    AKS_CLUSTER_NAME: aks-ww-platform-prod-wu3
    NAMESPACE: kanninja
    # Non-secret GitHub App identifiers (visible in the App's URL).
    GHCR_APP_ID: "3486525"
    GHCR_APP_INSTALLATION_ID: "126646503"

jobs:
    # ------------------------------------------------------------------
    # Build & push backend image
    # ------------------------------------------------------------------
    build-backend:
        name: Build backend
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            image: ${{ steps.meta.outputs.tags }}
            digest: ${{ steps.build.outputs.digest }}
            sha_tag: ${{ steps.vars.outputs.sha_tag }}
        steps:
            - uses: actions/checkout@v4

            - name: Set version tag
              id: vars
              run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

            - uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/kanninja-backend
                  tags: |
                      type=sha,prefix=sha-,format=short
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build & push
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile.backend
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=backend
                  cache-to: type=gha,mode=max,scope=backend,ignore-error=true

    # ------------------------------------------------------------------
    # Build & push frontend image (Next.js — public env vars baked in)
    # ------------------------------------------------------------------
    build-frontend:
        name: Build frontend
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            image: ${{ steps.meta.outputs.tags }}
            digest: ${{ steps.build.outputs.digest }}
            sha_tag: ${{ steps.vars.outputs.sha_tag }}
        steps:
            - uses: actions/checkout@v4

            - name: Set version tag
              id: vars
              run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

            - uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/kanninja-frontend
                  tags: |
                      type=sha,prefix=sha-,format=short
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build & push
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile.frontend
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=frontend
                  cache-to: type=gha,mode=max,scope=frontend,ignore-error=true
                  build-args: |
                      NEXT_PUBLIC_API_URL=https://api.kanninja.com
                      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
                      NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                      NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    # ------------------------------------------------------------------
    # Build & push MCP server image (published only — NOT deployed to AKS)
    # ------------------------------------------------------------------
    build-mcp:
        name: Build MCP server
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/kanninja-mcp
                  tags: |
                      type=sha,prefix=sha-,format=short
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build & push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile.mcp
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=mcp
                  cache-to: type=gha,mode=max,scope=mcp,ignore-error=true

    # ------------------------------------------------------------------
    # Deploy to AKS
    # ------------------------------------------------------------------
    deploy:
        name: Deploy to AKS
        runs-on: ubuntu-latest
        needs: [ build-backend, build-frontend ]
        permissions:
            id-token: write # required for Azure OIDC
            contents: read
        concurrency:
            group: deploy-aks-prod
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v4

            - name: Azure login (OIDC)
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            # kubelogin isn't on ubuntu-latest by default — install it before
            # aks-set-context, which invokes it when use-kubelogin: true.
            # GITHUB_TOKEN is required because the action queries GitHub's
            # release API to resolve kubelogin-version: latest.
            - name: Install kubelogin
              uses: azure/use-kubelogin@v1
              with:
                  kubelogin-version: latest
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Get AKS credentials
              uses: azure/aks-set-context@v4
              with:
                  resource-group: ${{ env.AKS_RESOURCE_GROUP }}
                  cluster-name: ${{ env.AKS_CLUSTER_NAME }}
                  admin: false
                  use-kubelogin: true

            - name: Set up Kustomize
              uses: imranismail/setup-kustomize@v2

            # Ensure the namespace exists before we try to write Secrets into it.
            # Idempotent: the `kubectl apply -k` step below reconciles it anyway.
            - name: Ensure namespace
              run: |
                  kubectl get namespace ${{ env.NAMESPACE }} 2>/dev/null \
                    || kubectl create namespace ${{ env.NAMESPACE }}

            # Upsert the three cluster Secrets from individual GitHub Actions
            # secrets (one GH secret per env var — rotatable and auditable
            # independently). Runs every deploy so GH is the source of truth.
            - name: Bootstrap cluster Secrets from GitHub Actions secrets
              env:
                  # --- Backend core ---
                  # CLERK_PUBLISHABLE_KEY isn't read by backend code, only
                  # frontend at build time — omitted from this block.
                  SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
                  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
                  DATABASE_URL:              ${{ secrets.DATABASE_URL }}
                  CLERK_SECRET_KEY:          ${{ secrets.CLERK_SECRET_KEY }}
                  CLERK_WEBHOOK_SECRET:      ${{ secrets.CLERK_WEBHOOK_SECRET }}
                  STRIPE_SECRET_KEY:         ${{ secrets.STRIPE_SECRET_KEY }}
                  STRIPE_WEBHOOK_SECRET:     ${{ secrets.STRIPE_WEBHOOK_SECRET }}
                  OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
                  INTEGRATION_ENCRYPTION_KEY: ${{ secrets.INTEGRATION_ENCRYPTION_KEY }}

                  # --- Optional: OAuth provider integrations ---
                  GOOGLE_CLIENT_ID:          ${{ secrets.GOOGLE_CLIENT_ID }}
                  GOOGLE_CLIENT_SECRET:      ${{ secrets.GOOGLE_CLIENT_SECRET }}
                  SLACK_CLIENT_ID:           ${{ secrets.SLACK_CLIENT_ID }}
                  SLACK_CLIENT_SECRET:       ${{ secrets.SLACK_CLIENT_SECRET }}
                  SLACK_SIGNING_SECRET:      ${{ secrets.SLACK_SIGNING_SECRET }}
                  GH_APP_CLIENT_ID:          ${{ secrets.GH_APP_CLIENT_ID }}
                  GH_APP_CLIENT_SECRET:      ${{ secrets.GH_APP_CLIENT_SECRET }}
                  GH_APP_WEBHOOK_SECRET:     ${{ secrets.GH_APP_WEBHOOK_SECRET }}
                  MICROSOFT_CLIENT_ID:       ${{ secrets.MICROSOFT_CLIENT_ID }}
                  MICROSOFT_CLIENT_SECRET:   ${{ secrets.MICROSOFT_CLIENT_SECRET }}
                  MICROSOFT_TENANT_ID:       ${{ secrets.MICROSOFT_TENANT_ID }}
                  ATLASSIAN_CLIENT_ID:       ${{ secrets.ATLASSIAN_CLIENT_ID }}
                  ATLASSIAN_CLIENT_SECRET:   ${{ secrets.ATLASSIAN_CLIENT_SECRET }}
                  GITLAB_CLIENT_ID:          ${{ secrets.GITLAB_CLIENT_ID }}
                  GITLAB_CLIENT_SECRET:      ${{ secrets.GITLAB_CLIENT_SECRET }}
                  GITLAB_INSTANCE_URL:       ${{ secrets.GITLAB_INSTANCE_URL }}
                  DISCORD_CLIENT_ID:         ${{ secrets.DISCORD_CLIENT_ID }}
                  DISCORD_CLIENT_SECRET:     ${{ secrets.DISCORD_CLIENT_SECRET }}
                  DISCORD_BOT_TOKEN:         ${{ secrets.DISCORD_BOT_TOKEN }}
                  DISCORD_PUBLIC_KEY:        ${{ secrets.DISCORD_PUBLIC_KEY }}
                  NOTION_CLIENT_ID:          ${{ secrets.NOTION_CLIENT_ID }}
                  NOTION_CLIENT_SECRET:      ${{ secrets.NOTION_CLIENT_SECRET }}
                  FIGMA_CLIENT_ID:           ${{ secrets.FIGMA_CLIENT_ID }}
                  FIGMA_CLIENT_SECRET:       ${{ secrets.FIGMA_CLIENT_SECRET }}
                  LINEAR_CLIENT_ID:          ${{ secrets.LINEAR_CLIENT_ID }}
                  LINEAR_CLIENT_SECRET:      ${{ secrets.LINEAR_CLIENT_SECRET }}
                  DROPBOX_CLIENT_ID:         ${{ secrets.DROPBOX_CLIENT_ID }}
                  DROPBOX_CLIENT_SECRET:     ${{ secrets.DROPBOX_CLIENT_SECRET }}
                  LOOM_CLIENT_ID:            ${{ secrets.LOOM_CLIENT_ID }}
                  LOOM_CLIENT_SECRET:        ${{ secrets.LOOM_CLIENT_SECRET }}
                  ZENDESK_CLIENT_ID:         ${{ secrets.ZENDESK_CLIENT_ID }}
                  ZENDESK_CLIENT_SECRET:     ${{ secrets.ZENDESK_CLIENT_SECRET }}
                  INTERCOM_CLIENT_ID:        ${{ secrets.INTERCOM_CLIENT_ID }}
                  INTERCOM_CLIENT_SECRET:    ${{ secrets.INTERCOM_CLIENT_SECRET }}
                  HUBSPOT_CLIENT_ID:         ${{ secrets.HUBSPOT_CLIENT_ID }}
                  HUBSPOT_CLIENT_SECRET:     ${{ secrets.HUBSPOT_CLIENT_SECRET }}
                  SALESFORCE_CLIENT_ID:      ${{ secrets.SALESFORCE_CLIENT_ID }}
                  SALESFORCE_CLIENT_SECRET:  ${{ secrets.SALESFORCE_CLIENT_SECRET }}

                  # --- GHCR App for the pull-token rotator ---
                  GHCR_APP_PRIVATE_KEY:      ${{ secrets.GHCR_APP_PRIVATE_KEY }}
              run: |
                  set -euo pipefail
                  NS=${{ env.NAMESPACE }}

                  # Required GH secrets = the ones the server strictly needs
                  # to boot + serve auth requests. Everything else is a
                  # feature-level dependency (Stripe, OpenAI, integrations)
                  # that the backend code handles gracefully when absent.
                  # Keeping this list tight so optional features don't
                  # block the deploy.
                  required=(
                    SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY DATABASE_URL
                    CLERK_SECRET_KEY
                    GHCR_APP_PRIVATE_KEY
                  )
                  missing=()
                  for var in "${required[@]}"; do
                    if [ -z "${!var:-}" ]; then missing+=("$var"); fi
                  done
                  if [ ${#missing[@]} -gt 0 ]; then
                    echo "::error::Required GitHub Actions secrets are empty: ${missing[*]}"
                    echo "::error::Set them at: Settings → Secrets and variables → Actions"
                    exit 1
                  fi

                  # Backend: build --from-literal args only for non-empty vars
                  # so optional provider secrets don't create empty Secret keys.
                  # ConfigMap-owned keys (NODE_ENV, HOST, PORT, FRONTEND_URL)
                  # are intentionally not in the list above. CLERK_PUBLISHABLE_KEY
                  # is declared in env.ts but never read — omitted.
                  backend_keys=(
                    SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY DATABASE_URL
                    CLERK_SECRET_KEY CLERK_WEBHOOK_SECRET
                    STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET
                    OPENAI_API_KEY INTEGRATION_ENCRYPTION_KEY
                    GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET
                    SLACK_CLIENT_ID SLACK_CLIENT_SECRET SLACK_SIGNING_SECRET
                    MICROSOFT_CLIENT_ID MICROSOFT_CLIENT_SECRET MICROSOFT_TENANT_ID
                    ATLASSIAN_CLIENT_ID ATLASSIAN_CLIENT_SECRET
                    GITLAB_CLIENT_ID GITLAB_CLIENT_SECRET GITLAB_INSTANCE_URL
                    DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET DISCORD_BOT_TOKEN DISCORD_PUBLIC_KEY
                    NOTION_CLIENT_ID NOTION_CLIENT_SECRET
                    FIGMA_CLIENT_ID FIGMA_CLIENT_SECRET
                    LINEAR_CLIENT_ID LINEAR_CLIENT_SECRET
                    DROPBOX_CLIENT_ID DROPBOX_CLIENT_SECRET
                    LOOM_CLIENT_ID LOOM_CLIENT_SECRET
                    ZENDESK_CLIENT_ID ZENDESK_CLIENT_SECRET
                    INTERCOM_CLIENT_ID INTERCOM_CLIENT_SECRET
                    HUBSPOT_CLIENT_ID HUBSPOT_CLIENT_SECRET
                    SALESFORCE_CLIENT_ID SALESFORCE_CLIENT_SECRET
                  )
                  # The integration backend code reads env.GITHUB_* at runtime;
                  # map GH_APP_* (renamed to avoid collision with GitHub's
                  # reserved GITHUB_ secret prefix) back to GITHUB_* keys here.
                  backend_extra_keys=(GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET GITHUB_WEBHOOK_SECRET)
                  declare -A backend_extra_sources=(
                    [GITHUB_CLIENT_ID]="$GH_APP_CLIENT_ID"
                    [GITHUB_CLIENT_SECRET]="$GH_APP_CLIENT_SECRET"
                    [GITHUB_WEBHOOK_SECRET]="$GH_APP_WEBHOOK_SECRET"
                  )

                  args=()
                  for key in "${backend_keys[@]}"; do
                    value="${!key:-}"
                    [ -n "$value" ] && args+=("--from-literal=$key=$value")
                  done
                  for key in "${backend_extra_keys[@]}"; do
                    value="${backend_extra_sources[$key]:-}"
                    [ -n "$value" ] && args+=("--from-literal=$key=$value")
                  done

                  kubectl -n "$NS" create secret generic backend-secrets \
                      "${args[@]}" \
                      --dry-run=client -o yaml | kubectl apply -f -

                  # Frontend: CLERK_SECRET_KEY only (Next.js middleware). Same
                  # value as backend's — one source of truth.
                  kubectl -n "$NS" create secret generic frontend-secrets \
                      --from-literal=CLERK_SECRET_KEY="$CLERK_SECRET_KEY" \
                      --dry-run=client -o yaml | kubectl apply -f -

                  # GHCR pull-token rotator credentials.
                  printf '%s' "$GHCR_APP_PRIVATE_KEY" > /tmp/private-key.pem
                  kubectl -n "$NS" create secret generic ghcr-app-credentials \
                      --from-literal=app-id="${{ env.GHCR_APP_ID }}" \
                      --from-literal=installation-id="${{ env.GHCR_APP_INSTALLATION_ID }}" \
                      --from-file=private-key.pem=/tmp/private-key.pem \
                      --dry-run=client -o yaml | kubectl apply -f -
                  shred -u /tmp/private-key.pem 2>/dev/null || rm -f /tmp/private-key.pem

                  echo "Upserted backend-secrets, frontend-secrets, ghcr-app-credentials."

            - name: Pin image tags
              working-directory: k8s
              run: |
                  SHA_TAG="sha-${GITHUB_SHA::7}"
                  kustomize edit set image \
                    ghcr.io/${{ env.IMAGE_OWNER }}/kanninja-backend=ghcr.io/${{ env.IMAGE_OWNER }}/kanninja-backend:${SHA_TAG}
                  kustomize edit set image \
                    ghcr.io/${{ env.IMAGE_OWNER }}/kanninja-frontend=ghcr.io/${{ env.IMAGE_OWNER }}/kanninja-frontend:${SHA_TAG}
                  echo "--- resolved kustomization.yaml ---"
                  cat kustomization.yaml

            - name: Apply manifests
              working-directory: k8s
              run: kubectl apply -k .

            # Trigger a one-off run of the GHCR token rotator so that
            # `ghcr-pull-secret` exists (or is freshly rotated) before the
            # Deployments try to pull images. Idempotent — safe to run on every deploy.
            - name: Prime GHCR pull secret
              run: |
                  set -e
                  JOB_NAME="ghcr-prime-$(date +%s)"
                  kubectl -n ${{ env.NAMESPACE }} create job --from=cronjob/ghcr-token-rotator "$JOB_NAME"
                  kubectl -n ${{ env.NAMESPACE }} wait --for=condition=complete --timeout=3m "job/$JOB_NAME"
                  kubectl -n ${{ env.NAMESPACE }} logs "job/$JOB_NAME" || true
                  kubectl -n ${{ env.NAMESPACE }} delete job "$JOB_NAME"

            - name: Wait for rollout
              run: |
                  kubectl -n ${{ env.NAMESPACE }} rollout status deploy/backend --timeout=5m
                  kubectl -n ${{ env.NAMESPACE }} rollout status deploy/frontend --timeout=5m

            - name: Summary
              if: always()
              run: |
                  echo "### Deployment summary" >> $GITHUB_STEP_SUMMARY
                  kubectl -n ${{ env.NAMESPACE }} get deploy,svc,ingress >> $GITHUB_STEP_SUMMARY
