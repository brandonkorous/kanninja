apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kanninja
  namespace: kanninja
  annotations:
    # NGINX ingress controller
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # cert-manager — adjust ClusterIssuer name if different
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - kanninja.com
        - www.kanninja.com
      secretName: kanninja-com-tls
    - hosts:
        - api.kanninja.com
      secretName: api-kanninja-com-tls
  rules:
    - host: kanninja.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: www.kanninja.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: api.kanninja.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
