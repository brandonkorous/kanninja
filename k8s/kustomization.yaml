apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kanninja

resources:
  - namespace.yaml
  - configmap.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - mcp-deployment.yaml
  - mcp-service.yaml
  - reconcile-seats-cronjob.yaml

# NOTE: ingress.yaml / ingress-www-redirect.yaml were removed in the GKE
# migration. The sparx-prod cluster has no nginx ingress controller or
# cert-manager — HTTP(S) routing + TLS for kanninja.com / api.kanninja.com /
# mcp.kanninja.com is handled by the shared Caddy reverse proxy in the
# sparx-prod namespace (see sparx.works/k8s/caddy/Caddyfile). Caddy reaches
# these Services cross-namespace at <svc>.kanninja.svc.cluster.local.
#
# ghcr-rotator.yaml was also removed: Artifact Registry images are pulled by
# the Autopilot node SA, so no imagePullSecrets / token rotation is needed.

# Image tags are rewritten by the GitHub Actions deploy workflow
# via `kustomize edit set image`. Defaults below are used for manual
# `kubectl apply -k .` runs.
images:
  - name: us-central1-docker.pkg.dev/sparxworks/kanninja/backend
    newTag: latest
  - name: us-central1-docker.pkg.dev/sparxworks/kanninja/frontend
    newTag: latest
  - name: us-central1-docker.pkg.dev/sparxworks/kanninja/mcp-remote
    newTag: latest
