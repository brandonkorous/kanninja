apiVersion: batch/v1
kind: CronJob
metadata:
  name: reconcile-seats
  namespace: kanninja
  labels:
    app.kubernetes.io/name: reconcile-seats
    app.kubernetes.io/part-of: kanninja
spec:
  # 09:00 UTC daily — 02:00 PT, off-peak.
  schedule: "0 9 * * *"
  # Don't start a new run if the previous one is still going.
  concurrencyPolicy: Forbid
  # Retain a few runs for log inspection without piling up forever.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Allow up to 15 minutes for the job to start before considering it missed.
  startingDeadlineSeconds: 900
  jobTemplate:
    spec:
      # Don't retry the whole job on failure — the script handles per-row
      # failures internally and exits non-zero only when something needs
      # attention. A retry would just re-process the same rows.
      backoffLimit: 0
      # Tear down completed jobs after 24h.
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: reconcile-seats
            app.kubernetes.io/part-of: kanninja
        spec:
          restartPolicy: Never
          # No imagePullSecrets: the GHCR packages are public, pulled anonymously.
          containers:
            - name: reconcile-seats
              image: ghcr.io/brandonkorous/kanninja-backend:latest
              imagePullPolicy: IfNotPresent
              command: ["node", "dist/scripts/reconcile-seats.js"]
              # Same env as the backend so the script gets DATABASE_URL,
              # STRIPE_SECRET_KEY, etc. ConfigMap last so prod values win
              # over any stale secret keys.
              envFrom:
                - secretRef:
                    name: backend-secrets
                - configMapRef:
                    name: backend-config
              resources:
                requests:
                  cpu: '50m'
                  memory: '128Mi'
                limits:
                  cpu: '500m'
                  memory: '512Mi'
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop: ['ALL']
                readOnlyRootFilesystem: true
