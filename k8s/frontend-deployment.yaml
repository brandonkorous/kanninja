apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: kanninja
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: kanninja
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: kanninja
    spec:
      # No imagePullSecrets: the GHCR packages are public, pulled anonymously.
      containers:
        - name: frontend
          image: ghcr.io/brandonkorous/kanninja-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          # ConfigMap after Secret so prod NODE_ENV/HOSTNAME/PORT can't be
          # accidentally overridden by a stale dev value.
          envFrom:
            - secretRef:
                name: frontend-secrets
            - configMapRef:
                name: frontend-config
          # WizeLens ingest key: this app's own (vault `wizelens-key-frontend`), so it
          # can be revoked alone. Optional: a missing key leaves the app running,
          # only untraced in the cloud. The other WIZELENS_* are in frontend-config.
          env:
            - name: WIZELENS_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: frontend-secrets
                  key: WIZELENS_KEY_FRONTEND
                  optional: true
          resources:
            requests:
              cpu: '50m'
              memory: '192Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ['ALL']
      terminationGracePeriodSeconds: 30
