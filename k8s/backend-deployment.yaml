apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kanninja
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: kanninja
spec:
  # DO NOT raise above 1 without adding a shared realtime bus (Redis pub/sub).
  # The WebSocket hub in src/services/realtime-hub.ts fans out only to sockets
  # on THIS pod: with 2+ replicas, board broadcasts would silently reach a
  # fraction of connected clients and presence rosters would fragment per-pod.
  # Nothing would error — it would just quietly be wrong.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: kanninja
    spec:
      # No imagePullSecrets: the GHCR packages are public, pulled anonymously
      # (ghcr.io/brandonkorous/kanninja) and the Autopilot node
      # SA pulls them natively. The old GHCR pull-token rotator is retired.
      containers:
        - name: backend
          image: ghcr.io/brandonkorous/kanninja-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          # Ordering matters: the last source wins on overlapping keys.
          # ConfigMap is listed *after* the Secret so prod config (NODE_ENV,
          # HOST, PORT, FRONTEND_URL) can't be accidentally downgraded by a
          # stale dev value in backend-secrets.
          envFrom:
            - secretRef:
                name: backend-secrets
            - configMapRef:
                name: backend-config
          resources:
            requests:
              cpu: '50m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # THE ONLY PROBE THAT TOUCHES THE DATABASE, deliberately.
          #
          # Readiness controls Service membership: a failure takes this pod out
          # of rotation and leaves it running. That is the correct response to
          # Postgres being unreachable — stop advertising, keep the process,
          # recover when the database does.
          #
          # The startup and liveness probes above stay on the static /api/health
          # for the opposite reason: they KILL the container, and restarting a
          # pod does not repair a database. Pointing them here would turn a brief
          # Postgres blip into a fleet-wide crashloop that outlives its cause.
          #
          # Before this split every probe hit the static endpoint, so a pod went
          # Ready and served traffic with no database at all: the deploy went
          # green, the rollout succeeded, and every request 500'd.
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ['ALL']
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 30
