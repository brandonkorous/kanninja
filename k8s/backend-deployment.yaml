apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kanninja
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: kanninja
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: kanninja
    spec:
      # No imagePullSecrets: images live in Artifact Registry
      # (us-central1-docker.pkg.dev/sparxworks/kanninja) and the Autopilot node
      # SA pulls them natively. The old GHCR pull-token rotator is retired.
      containers:
        - name: backend
          image: us-central1-docker.pkg.dev/sparxworks/kanninja/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          # Ordering matters: the last source wins on overlapping keys.
          # ConfigMap is listed *after* the Secret so prod config (NODE_ENV,
          # HOST, PORT, FRONTEND_URL) can't be accidentally downgraded by a
          # stale dev value in backend-secrets.
          envFrom:
            - secretRef:
                name: backend-secrets
            - configMapRef:
                name: backend-config
          resources:
            requests:
              cpu: '50m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ['ALL']
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 30
