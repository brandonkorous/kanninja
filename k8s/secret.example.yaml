# Template only — DO NOT commit real secrets.
# Apply with: kubectl apply -f secret.yaml  (after filling values)
# Or create directly from env file:
#   kubectl -n kanninja create secret generic backend-secrets --from-env-file=backend.env
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: kanninja
type: Opaque
stringData:
  # Core — Azure Database for PostgreSQL Flexible Server (TLS required)
  DATABASE_URL: ""

  # Auth — Better Auth
  # openssl rand -base64 32. Rotating this signs every user out.
  BETTER_AUTH_SECRET: ""
  BETTER_AUTH_URL: "https://api.kanninja.com"
  AUTH_COOKIE_DOMAIN: ".kanninja.com"
  # Sign-in only. Distinct from GOOGLE_CLIENT_ID below, which is the
  # Calendar/Gmail/Drive data integration.
  GOOGLE_AUTH_CLIENT_ID: ""
  GOOGLE_AUTH_CLIENT_SECRET: ""

  # Transactional email (verification codes, password resets)
  RESEND_API_KEY: ""
  EMAIL_FROM: "kanNINJA <noreply@kanninja.com>"

  # Azure Blob Storage — card attachments
  AZURE_STORAGE_ACCOUNT: ""
  AZURE_STORAGE_KEY: ""
  AZURE_STORAGE_CONTAINER: "card-attachments"

  # Clerk — OUTGOING. Keeps the legacy verification branch in require-auth.ts
  # alive for the rollback window; clearing CLERK_SECRET_KEY disables it.
  # Delete this block at T+7d after cutover.
  CLERK_SECRET_KEY: ""
  CLERK_WEBHOOK_SECRET: ""

  # Stripe
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""

  # OpenAI
  # Azure OpenAI — Whisper transcription only.
  AZURE_OPENAI_ENDPOINT: "https://oai-jotdojo-prod-eus2.openai.azure.com/"
  AZURE_OPENAI_API_KEY: ""
  AZURE_OPENAI_API_VERSION: "2024-06-01"
  AZURE_OPENAI_SPEECH_DEPLOYMENT: "jotdojo-speech"

  # Integration system
  INTEGRATION_ENCRYPTION_KEY: ""

  # Integrations — OAuth providers (fill only what you use)
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  SLACK_CLIENT_ID: ""
  SLACK_CLIENT_SECRET: ""
  SLACK_SIGNING_SECRET: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  GITHUB_WEBHOOK_SECRET: ""
  MICROSOFT_CLIENT_ID: ""
  MICROSOFT_CLIENT_SECRET: ""
  MICROSOFT_TENANT_ID: ""
  ATLASSIAN_CLIENT_ID: ""
  ATLASSIAN_CLIENT_SECRET: ""
  GITLAB_CLIENT_ID: ""
  GITLAB_CLIENT_SECRET: ""
  GITLAB_INSTANCE_URL: ""
  DISCORD_CLIENT_ID: ""
  DISCORD_CLIENT_SECRET: ""
  DISCORD_BOT_TOKEN: ""
  DISCORD_PUBLIC_KEY: ""
  NOTION_CLIENT_ID: ""
  NOTION_CLIENT_SECRET: ""
  FIGMA_CLIENT_ID: ""
  FIGMA_CLIENT_SECRET: ""
  LINEAR_CLIENT_ID: ""
  LINEAR_CLIENT_SECRET: ""
  DROPBOX_CLIENT_ID: ""
  DROPBOX_CLIENT_SECRET: ""
  LOOM_CLIENT_ID: ""
  LOOM_CLIENT_SECRET: ""
  ZENDESK_CLIENT_ID: ""
  ZENDESK_CLIENT_SECRET: ""
  INTERCOM_CLIENT_ID: ""
  INTERCOM_CLIENT_SECRET: ""
  HUBSPOT_CLIENT_ID: ""
  HUBSPOT_CLIENT_SECRET: ""
  SALESFORCE_CLIENT_ID: ""
  SALESFORCE_CLIENT_SECRET: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: frontend-secrets
  namespace: kanninja
type: Opaque
stringData: {}
  # Intentionally empty. The frontend holds no secrets: its middleware only
  # checks whether a session cookie is present, and the authoritative session
  # check is an API call. Kept as a resource so `envFrom` keeps resolving.
