  # Stripe
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""

  # OpenAI
  OPENAI_API_KEY: ""

  # Integration system
  INTEGRATION_ENCRYPTION_KEY: ""

  # Integrations — OAuth providers (fill only what you use)
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  SLACK_CLIENT_ID: ""
  SLACK_CLIENT_SECRET: ""
  SLACK_SIGNING_SECRET: ""
