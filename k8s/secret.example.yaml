# Template only — DO NOT commit real secrets.
# Apply with: kubectl apply -f secret.yaml  (after filling values)
# Or create directly from env file:
#   kubectl -n kanninja create secret generic backend-secrets --from-env-file=backend.env
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: kanninja
type: Opaque
