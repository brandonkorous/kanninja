# Template only — DO NOT commit real secrets.
# Apply with: kubectl apply -f secret.yaml  (after filling values)
# Or create directly from env file:
#   kubectl -n kanninja create secret generic backend-secrets --from-env-file=backend.env
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: kanninja
type: Opaque
stringData:
  # Core — Azure Database for PostgreSQL Flexible Server (TLS required)
  DATABASE_URL: ""

  # Auth — Better Auth
  # openssl rand -base64 32. Rotating this signs every user out.
  BETTER_AUTH_SECRET: ""
  BETTER_AUTH_URL: "https://api.kanninja.com"
  AUTH_COOKIE_DOMAIN: ".kanninja.com"
  # Sign-in only. Distinct from GOOGLE_CLIENT_ID below, which is the
  # Calendar/Gmail/Drive data integration.
  GOOGLE_AUTH_CLIENT_ID: ""
  GOOGLE_AUTH_CLIENT_SECRET: ""

  # Transactional email (verification codes, password resets)
  RESEND_API_KEY: ""
  EMAIL_FROM: "kanNINJA <noreply@kanninja.com>"

  # Azure Blob Storage — card attachments
  AZURE_STORAGE_ACCOUNT: ""
  AZURE_STORAGE_KEY: ""
  AZURE_STORAGE_CONTAINER: "card-attachments"
  # Profile pictures. Separate container, private, streamed through the API.
  AZURE_AVATARS_CONTAINER: "avatars"

  # Stripe
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""

  # Azure OpenAI — Whisper transcription for voice capture. The only model
  # call left in the product.
  #
  # Fill these from kanNINJA's OWN account (oai-kanninja-prod-eus2, deployment
  # `kanninja-speech`), never jotDOJO's. This example used to ship the jotDOJO
  # endpoint and deployment as literals, so copying it verbatim transcribed on
  # another product's account and inside its rate limit — a failure that only
  # shows up when that team rotates a key. Left blank on purpose: empty means
  # voice capture returns a 503 naming these variables, and nothing else is
  # affected. See backend/src/config/azure-openai.ts.
  AZURE_OPENAI_ENDPOINT: ""
  AZURE_OPENAI_API_KEY: ""
  AZURE_OPENAI_API_VERSION: "2024-06-01"
  AZURE_OPENAI_SPEECH_DEPLOYMENT: ""

  # Integration system
  INTEGRATION_ENCRYPTION_KEY: ""

  # Integrations — OAuth providers (fill only what you use)
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  SLACK_CLIENT_ID: ""
  SLACK_CLIENT_SECRET: ""
  SLACK_SIGNING_SECRET: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  GITHUB_WEBHOOK_SECRET: ""
  MICROSOFT_CLIENT_ID: ""
  MICROSOFT_CLIENT_SECRET: ""
  MICROSOFT_TENANT_ID: ""
  ATLASSIAN_CLIENT_ID: ""
  ATLASSIAN_CLIENT_SECRET: ""
  GITLAB_CLIENT_ID: ""
  GITLAB_CLIENT_SECRET: ""
  GITLAB_INSTANCE_URL: ""
  DISCORD_CLIENT_ID: ""
  DISCORD_CLIENT_SECRET: ""
  DISCORD_BOT_TOKEN: ""
  DISCORD_PUBLIC_KEY: ""
  NOTION_CLIENT_ID: ""
  NOTION_CLIENT_SECRET: ""
  FIGMA_CLIENT_ID: ""
  FIGMA_CLIENT_SECRET: ""
  LINEAR_CLIENT_ID: ""
  LINEAR_CLIENT_SECRET: ""
  DROPBOX_CLIENT_ID: ""
  DROPBOX_CLIENT_SECRET: ""
  LOOM_CLIENT_ID: ""
  LOOM_CLIENT_SECRET: ""
  ZENDESK_CLIENT_ID: ""
  ZENDESK_CLIENT_SECRET: ""
  INTERCOM_CLIENT_ID: ""
  INTERCOM_CLIENT_SECRET: ""
  HUBSPOT_CLIENT_ID: ""
  HUBSPOT_CLIENT_SECRET: ""
  SALESFORCE_CLIENT_ID: ""
  SALESFORCE_CLIENT_SECRET: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: frontend-secrets
  namespace: kanninja
type: Opaque
stringData: {}
  # Intentionally empty. The frontend holds no secrets: its middleware only
  # checks whether a session cookie is present, and the authoritative session
  # check is an API call. Kept as a resource so `envFrom` keeps resolving.
