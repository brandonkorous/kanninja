# GHCR Pull Secret Rotator
#
# A CronJob that mints a fresh installation access token from our GitHub App
# every 50 minutes and writes it to the `ghcr-pull-secret` docker-registry
# Secret that the backend/frontend Deployments reference via imagePullSecrets.
#
# The only long-lived credential in this chain is the GitHub App's private
# key (stored in the `ghcr-app-credentials` Secret, which is created manually
# and never committed). The tokens this produces are short-lived (~1 hour),
# automatically rotated, and system-owned — no human PATs.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ghcr-token-rotator
  namespace: kanninja
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ghcr-token-rotator
  namespace: kanninja
rules:
  # Read the GitHub App credentials input.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ghcr-app-credentials"]
    verbs: ["get"]
  # Create `ghcr-pull-secret` on the first run (the `create` verb cannot
  # be scoped by resource name in RBAC; this SA is single-purpose so the
  # broader scope is acceptable).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # Read/update the target pull secret on subsequent rotations.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ghcr-pull-secret"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ghcr-token-rotator
  namespace: kanninja
subjects:
  - kind: ServiceAccount
    name: ghcr-token-rotator
    namespace: kanninja
roleRef:
  kind: Role
  name: ghcr-token-rotator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ghcr-rotator-script
  namespace: kanninja
data:
  rotate.sh: |
    #!/bin/sh
    # Sign a JWT with the GitHub App's private key, exchange it for an
    # installation access token, and upsert a docker-registry Secret
    # containing that token. Runs on every CronJob tick.
    set -eu

    : "${APP_ID:?APP_ID required}"
    : "${INSTALLATION_ID:?INSTALLATION_ID required}"
    : "${NAMESPACE:?NAMESPACE required}"
    PRIVATE_KEY_PATH="${PRIVATE_KEY_PATH:-/secrets/private-key.pem}"
    TARGET_SECRET="${TARGET_SECRET:-ghcr-pull-secret}"
    REGISTRY="${REGISTRY:-ghcr.io}"
    KUBECTL_VERSION="${KUBECTL_VERSION:-v1.30.5}"

    # Install tooling. Alpine's repos don't ship kubectl, so fetch a pinned binary.
    apk add --no-cache openssl curl jq ca-certificates >/dev/null
    curl -fsSLo /usr/local/bin/kubectl \
      "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
    chmod +x /usr/local/bin/kubectl

    b64url() {
      openssl base64 -A | tr -d '=' | tr '+/' '-_'
    }

    # GitHub App JWTs max out at 10 minutes. 60s back for clock skew, 9 min forward.
    now=$(date +%s)
    iat=$((now - 60))
    exp=$((now + 540))

    header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
    payload=$(printf '{"iat":%d,"exp":%d,"iss":%s}' "$iat" "$exp" "$APP_ID" | b64url)
    unsigned="${header}.${payload}"
    sig=$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$PRIVATE_KEY_PATH" -binary | b64url)
    jwt="${unsigned}.${sig}"

    # Exchange the App JWT for an installation access token (~1h TTL).
    token=$(curl -fsS -X POST \
      -H "Accept: application/vnd.github+json" \
      -H "Authorization: Bearer $jwt" \
      -H "X-GitHub-Api-Version: 2022-11-28" \
      "https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens" \
      | jq -r '.token')

    if [ -z "$token" ] || [ "$token" = "null" ]; then
      echo "Failed to obtain installation token" >&2
      exit 1
    fi

    # Upsert the docker-registry Secret. `kubectl apply` with --dry-run=client
    # produces the YAML, then we pipe it back through apply to get create-or-update
    # semantics.
    kubectl create secret docker-registry "$TARGET_SECRET" \
      --docker-server="$REGISTRY" \
      --docker-username=x-access-token \
      --docker-password="$token" \
      --namespace="$NAMESPACE" \
      --dry-run=client -o yaml | kubectl apply -f -

    echo "Rotated $TARGET_SECRET in namespace $NAMESPACE at $(date -u +%FT%TZ)"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ghcr-token-rotator
  namespace: kanninja
spec:
  # Every 50 minutes — tokens live ~1 hour, so this gives a 10-minute overlap.
  schedule: "*/50 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: ghcr-token-rotator
          restartPolicy: OnFailure
          containers:
            - name: rotator
              image: alpine:3.20
              command: ["/bin/sh", "/scripts/rotate.sh"]
              env:
                - name: APP_ID
                  valueFrom:
                    secretKeyRef:
                      name: ghcr-app-credentials
                      key: app-id
                - name: INSTALLATION_ID
                  valueFrom:
                    secretKeyRef:
                      name: ghcr-app-credentials
                      key: installation-id
                - name: NAMESPACE
                  value: kanninja
              resources:
                requests:
                  cpu: "10m"
                  memory: "32Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
              volumeMounts:
                - name: private-key
                  mountPath: /secrets
                  readOnly: true
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: private-key
              secret:
                secretName: ghcr-app-credentials
                items:
                  - key: private-key.pem
                    path: private-key.pem
            - name: script
              configMap:
                name: ghcr-rotator-script
                defaultMode: 0755
