# Fly.io config for kanNINJA backend (Fastify API).
# Deploy from v2/ root: `fly deploy --config fly.backend.toml`

app = "kanninja-backend"
primary_region = "iad"  # change to the region closest to your users / database

[build]
  dockerfile = "Dockerfile.backend"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  HOST = "0.0.0.0"
  # FRONTEND_URL must match the deployed frontend origin for CORS
  FRONTEND_URL = "https://kanninja-frontend.fly.dev"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
